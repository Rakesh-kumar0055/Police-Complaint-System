<!DOCTYPE html>
<html>
<head>
    <title>Track Complaint</title>

    <!-- ✅ CSS Link (VERY IMPORTANT) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

    <h2>Track Complaint</h2>

    <form method="POST">
        <input type="text" name="tracking_id" placeholder="Enter Tracking ID (e.g. CMP123ABC)" required>
        <button type="submit">Track</button>
    </form>

    <br>

    {% if complaint %}
        <div style="text-align:center;">
            <h3>Status: {{ complaint['status'] }}</h3>
            <p><strong>Title:</strong> {{ complaint['title'] }}</p>
            <p><strong>Date:</strong> {{ complaint['date'] }}</p>
        </div>

    {% elif complaint is not none %}
        <p style="color:red; text-align:center;">Invalid Tracking ID</p>
    {% endif %}

    <br>
    <a href="/">← Back to Home</a>

</div>

</body>
</html>
