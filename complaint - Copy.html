<!DOCTYPE html>
<html>
<head>
    <title>File Complaint</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            background-color: #f1f5f9;
        }

        .form-box {
            background: white;
            padding: 25px;
            margin-block-start: 30px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        h3 {
            margin-block-end: 20px;
            color: #0d3b66;
        }

        #map {
            block-size: 300px;
            inline-size: 100%;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="form-box">

        <h3>File Complaint</h3>

        <form method="POST" enctype="multipart/form-data">

            <h5>Complainant Details</h5>

            <div class="row">
                <div class="col-md-6">
                    <input class="form-control mb-3" type="text" name="person_name" placeholder="Full Name" required>
                </div>

                <div class="col-md-6">
                    <input class="form-control mb-3" type="text" name="phone" placeholder="Mobile Number" required>
                </div>

                <div class="col-md-6">
                    <input class="form-control mb-3" type="email" name="email" placeholder="Email ID">
                </div>

                <div class="col-md-6">
                    <input class="form-control mb-3" type="text" name="address" placeholder="Address" required>
                </div>
            </div>

            <h5>Complaint Details</h5>

            <input class="form-control mb-3" type="text" name="title" placeholder="Complaint Title" required>

            <textarea class="form-control mb-3" name="description" placeholder="Complaint Description" required></textarea>

            <input class="form-control mb-3" type="file" name="image">

            <input type="hidden" name="latitude" id="lat">
            <input type="hidden" name="longitude" id="lng">

            <label><b>Select Complaint Location:</b></label>
            <div id="map"></div>

            <button class="btn btn-primary mt-3" type="submit">Submit Complaint</button>

        </form>
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    var map = L.map('map').setView([12.9716, 77.5946], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var marker;

    map.on('click', function(e) {
        var lat = e.latlng.lat;
        var lng = e.latlng.lng;

        document.getElementById('lat').value = lat;
        document.getElementById('lng').value = lng;

        if (marker) {
            map.removeLayer(marker);
        }

        marker = L.marker([lat, lng]).addTo(map)
            .bindPopup("Complaint Location")
            .openPopup();
    });
</script>

</body>
</html>
