<!DOCTYPE html>
<html>
<head>
    <title>Police Complaint System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            block-size: 100vh;
        }

        .card-box {
            max-inline-size: 500px;
            margin: auto;
            margin-block-start: 60px;
            padding: 30px;
            border-radius: 15px;
            background: white;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            font-weight: 600;
            margin-block-end: 20px;
        }

        .btn-custom {
            inline-size: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }

        .btn-user {
            background: #4CAF50;
            color: white;
        }

        .btn-login {
            background: #2196F3;
            color: white;
        }

        .btn-track {
            background: #FFC107;
            color: black;
        }

        .btn-police {
            background: #343a40;
            color: white;
        }

        .btn-police-register {
            background: #6c757d;
            color: white;
        }

        .icon {
            font-size: 40px;
        }
    </style>
</head>

<body>

<div class="card-box">

    <div class="icon"></div>

    <h1>Police Complaint System</h1>

    <a href="/register" class="btn btn-custom btn-user">👤 User Register</a>
    <a href="/login" class="btn btn-custom btn-login">🔐 User Login</a>
    <a href="/track" class="btn btn-custom btn-track">📍 Track Complaint</a>

    <hr>

    <a href="/police_login" class="btn btn-custom btn-police">👮 Police Login</a>
    <a href="/police_register" class="btn btn-custom btn-police-register">📝 Police Register</a>
    <a href="/admin" class="btn btn-danger">Admin Panel</a>
</div>

</body>
</html>
