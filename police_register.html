<!DOCTYPE html>
<html>
<head>
    <title>Police Register</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container">

    <h2>Police Register</h2>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Officer Name"
               required>

        <input type="email"
               name="email"
               placeholder="Police Email"
               required>

        <select name="department" required>
            <option value="">Select Department</option>
            <option value="Traffic Police">Traffic Police</option>
            <option value="Cyber Crime">Cyber Crime</option>
            <option value="Women Safety">Women Safety</option>
            <option value="Theft/Robbery">Theft/Robbery</option>
            <option value="Public Disturbance">Public Disturbance</option>
            <option value="Missing Person">Missing Person</option>
            <option value="General Police">General Police</option>
        </select>

        <select name="station" required>
            <option value="">Select Police Station</option>
            <option value="Whitefield Police Station">Whitefield Police Station</option>
            <option value="KR Puram Police Station">KR Puram Police Station</option>
            <option value="Marathahalli Police Station">Marathahalli Police Station</option>
            <option value="Electronic City Police Station">Electronic City Police Station</option>
            <option value="Indiranagar Police Station">Indiranagar Police Station</option>
            <option value="Koramangala Police Station">Koramangala Police Station</option>
        </select>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Register
        </button>

    </form>

    <p style="text-align:center;">
        Already registered?
        <a href="/police_login">Login</a>
    </p>

    <a href="/">← Back to Home</a>

</div>

</body>
</html>
